name: Inspect original game archive

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-source.yml'
      - 'grok-workspace.zip'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Verify and inspect original archive
        shell: bash
        run: |
          set -euo pipefail
          test -s grok-workspace.zip
          echo "Archive size: $(stat -c%s grok-workspace.zip) bytes"
          unzip -t grok-workspace.zip | tail -n 2
          mkdir -p source
          unzip -q grok-workspace.zip -d source
          {
            echo "# Original game archive inspection"
            echo
            echo "- Archive size: $(stat -c%s grok-workspace.zip) bytes"
            echo "- Extracted files: $(find source -type f | wc -l)"
            echo
            echo "## File inventory (first 400)"
            echo '~~~text'
            find source -type f | sort | head -n 400
            echo '~~~'
            echo
            echo "## Project markers"
            find source -type f \( -name package.json -o -name pubspec.yaml -o -name '*.gradle' -o -name '*.gradle.kts' -o -name project.godot -o -name '*.uproject' -o -name manifest.json -o -name index.html -o -name README.md -o -name README.txt \) | sort
          } | tee inspection-report.md >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r f; do
            echo
            echo "===== $f ====="
            sed -n '1,220p' "$f"
          done < <(find source -type f \( -name package.json -o -name pubspec.yaml -o -name '*.gradle' -o -name '*.gradle.kts' -o -name project.godot -o -name '*.uproject' -o -name manifest.json -o -name README.md -o -name README.txt \) | sort)
      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: original-game-inspection
          path: inspection-report.md
          if-no-files-found: error
