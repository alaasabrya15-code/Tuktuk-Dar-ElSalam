name: Build Tuktuk Dar ElSalam APK
run-name: Build original game source into Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'grok-workspace.zip'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: read
concurrency:
  group: tuktuk-android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract original game source
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p extracted
          unzip -q grok-workspace.zip -d extracted
          if [ -f extracted/source/package.json ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/extracted/source"
          elif [ -f extracted/package.json ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE/extracted"
          else
            echo "Could not find the original game's package.json after extraction"
            find extracted -maxdepth 3 -name package.json -print
            exit 1
          fi
          test -s "$PROJECT_DIR/package-lock.json"
          test -s "$PROJECT_DIR/vite.apk.config.ts"
          test -s "$PROJECT_DIR/apk/index.html"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using original source at: $PROJECT_DIR"
      - name: Build the original game web bundle
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm ci
          npx vite build --config vite.apk.config.ts
          test -s apk/dist/index.html
          find apk/dist/assets -maxdepth 1 -type f -printf '%f %s bytes\n'
      - name: Verify built game assets
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          python3 - <<'PY'
          from pathlib import Path
          dist = Path("apk/dist")
          html = (dist / "index.html").read_text(encoding="utf-8")
          assets = dist / "assets"
          engines = list(assets.glob("engine-*.js"))
          apps = list(assets.glob("index-*.js"))
          styles = list(assets.glob("index-*.css"))
          assert len(engines) == 1, f"Expected one engine bundle, got {len(engines)}"
          assert len(apps) == 1, f"Expected one app bundle, got {len(apps)}"
          assert len(styles) == 1, f"Expected one stylesheet, got {len(styles)}"
          assert engines[0].stat().st_size > 500_000, "Engine bundle unexpectedly small"
          assert apps[0].stat().st_size > 150_000, "App bundle unexpectedly small"
          assert engines[0].name in apps[0].read_text(encoding="utf-8")
          assert apps[0].name in html and styles[0].name in html
          print("Original game bundle verification passed")
          PY
      - name: Package Android WebView application
        run: |
          set -euo pipefail
          mkdir -p android-app/app/src/main/assets android-app/app/src/main/java/com/darsalam/tuktuk
          cp -R "$PROJECT_DIR/apk/dist/." android-app/app/src/main/assets/
          cat > android-app/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'TuktukDarElSalam'
          include ':app'
          EOF
          cat > android-app/build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.7.3' apply false }
          EOF
          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > android-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.darsalam.tuktuk'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.darsalam.tuktuk'
                  minSdk 23
                  targetSdk 28
                  versionCode 3
                  versionName '1.2'
              }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
          EOF
          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:hardwareAccelerated="true" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="توكتوك دار السلام" android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:screenOrientation="landscape" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > android-app/app/src/main/java/com/darsalam/tuktuk/MainActivity.java <<'EOF'
          package com.darsalam.tuktuk;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import android.webkit.WebViewClient;
          import android.net.Uri;
          public class MainActivity extends Activity {
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().getDecorView().setSystemUiVisibility(5894 | 1024 | 512);
                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setSupportZoom(false);
                  settings.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  web.setLayerType(View.LAYER_TYPE_HARDWARE, null);
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF
      - name: Build and verify installable APK
        run: |
          set -euo pipefail
          cd android-app
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p apk-check
          unzip -q "$APK" -d apk-check
          test -s apk-check/assets/index.html
          test "$(find apk-check/assets/assets -maxdepth 1 -name 'engine-*.js' -size +500k | wc -l)" -eq 1
          test "$(find apk-check/assets/assets -maxdepth 1 -name 'index-*.js' -size +150k | wc -l)" -eq 1
          echo "APK verified: $(stat -c%s "$APK") bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: Tuktuk-Dar-ElSalam-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
