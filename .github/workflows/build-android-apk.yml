name: Build Tuktuk Dar ElSalam APK
run-name: Build complete game and Android APK
# Rebuild when the Fayoum Street visual script changes (stop mapping fixed).
on:
  workflow_dispatch:
  push:
    paths:
      - 'grok-workspace.zip'
      - 'tuktuk-enhancements.patch'
      - 'tuktuk-persistence.patch'
      - 'tuktuk-fayoum-upgrade.patch'
      - 'tuktuk-fayoum-landmarks.patch'
      - 'tuktuk-fayoum-stop-names.patch'
      - 'tuktuk-fayoum-full-visual.patch'
      - 'apply_fayoum_visual.py'
      - 'tuktuk-realism-detail.patch'
      - 'tuktuk-instancing-fix.patch'
      - '.github/workflows/build-android-apk.yml'
permissions:
  contents: read
concurrency:
  group: tuktuk-android-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p project
          unzip -q grok-workspace.zip -d project
          test -f project/package.json
          test -f project/package-lock.json
          test -f project/vite.apk.config.ts
          test -f project/apk/index.html
      - name: Apply game enhancements without removing original content
        run: |
          patch -d project -p1 < tuktuk-enhancements.patch
          patch -d project -p1 < tuktuk-persistence.patch
          patch -d project -p1 < tuktuk-fayoum-upgrade.patch
          patch -d project -p1 < tuktuk-fayoum-stop-names.patch
          python3 apply_fayoum_visual.py project
          patch -d project -p1 < tuktuk-realism-detail.patch
          patch -d project -p1 < tuktuk-instancing-fix.patch
          python3 - <<'PY'
          from pathlib import Path
          engine = Path('project/src/game/engine.ts').read_text(encoding='utf-8')
          ui = Path('project/src/components/dar-salam.tsx').read_text(encoding='utf-8')
          scene = Path('project/src/game/fayoum.ts').read_text(encoding='utf-8')
          assert 'game.current' not in ui, 'Undefined game ref remains in UI controls'
          assert 'gameRef.current' in ui, 'UI control ref was not repaired'
          checks = {
              'player locked to tuk-tuk': 'vehicle: "tuktuk"' in engine and 'swapPlayer("tuktuk", cfg.paint)' in engine,
              'horn and synthesized engine audio': 'horn() {' in engine and 'engine(speed: number, throttle: number)' in engine,
              'suspension response': 'suspensionOffset' in engine and 'suspensionVelocity' in engine,
              'Egyptian street frontage and landmarks': 'landmarkLabel' in scene and 'awningMats' in scene,
              'market and parked traffic dressing': 'Produce market cluster' in scene and 'Parked private cars' in scene,
              'tuk-tuk only UI': 'مركبتك: التوكتوك' in ui and 'اختار مركبتك' not in ui,
          }
          for label, ok in checks.items():
              print(('PASS' if ok else 'FAIL') + ': ' + label)
          if not all(checks.values()):
              raise SystemExit('Game feature validation failed')
          PY
          cd project
          zip -qr ../Tuktuk-Dar-ElSalam-Updated-Project.zip . -x 'node_modules/*' '.git/*'
      - name: Build web game
        working-directory: project
        run: |
          npm ci
          npx vite build --config vite.apk.config.ts
      - name: Verify the actual game bundle was built
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          dist = Path("apk/dist")
          html = (dist / "index.html").read_text(encoding="utf-8")
          assets = dist / "assets"
          engines = list(assets.glob("engine-*.js"))
          apps = list(assets.glob("index-*.js"))
          styles = list(assets.glob("index-*.css"))
          assert len(engines) == 1, f"Expected one game engine bundle, got {len(engines)}"
          assert len(apps) == 1, f"Expected one app bundle, got {len(apps)}"
          assert len(styles) == 1, f"Expected one stylesheet, got {len(styles)}"
          assert engines[0].stat().st_size > 500_000, "Game engine bundle is unexpectedly small"
          assert apps[0].stat().st_size > 150_000, "Application bundle is unexpectedly small"
          assert apps[0].name in html and styles[0].name in html, "index.html does not reference the app bundle and stylesheet"
          app_js = apps[0].read_text(encoding="utf-8")
          assert engines[0].name in app_js, "App bundle does not reference the game engine chunk"
          print(f"PASS: game engine {engines[0].stat().st_size:,} bytes")
          print(f"PASS: app code {apps[0].stat().st_size:,} bytes")
          print(f"PASS: styles {styles[0].stat().st_size:,} bytes")
          PY
      - name: Create Android WebView wrapper
        run: |
          mkdir -p android-app/app/src/main/assets android-app/app/src/main/java/com/darsalam/tuktuk
          cp -R project/apk/dist/. android-app/app/src/main/assets/
          cat > android-app/settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'TuktukDarElSalam'
          include ':app'
          EOF
          cat > android-app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > android-app/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          cat > android-app/app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.darsalam.tuktuk'
              compileSdk 35
              defaultConfig { applicationId 'com.darsalam.tuktuk'; minSdk 23; targetSdk 28; versionCode 2; versionName '1.1' }
          }
          dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
          EOF
          cat > android-app/app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="توكتوك دار السلام" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:screenOrientation="landscape" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > android-app/app/src/main/java/com/darsalam/tuktuk/MainActivity.java <<'EOF'
          package com.darsalam.tuktuk;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebView;
          import android.webkit.WebSettings;
          import androidx.webkit.WebViewAssetLoader;
          import androidx.webkit.WebViewClientCompat;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          public class MainActivity extends Activity {
              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().getDecorView().setSystemUiVisibility(5894 | 1024 | 512);
                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  settings.setAllowFileAccess(false);
                  settings.setAllowContentAccess(false);
                  settings.setLoadsImagesAutomatically(true);
                  settings.setJavaScriptCanOpenWindowsAutomatically(false);
                  WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                      .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                      .build();
                  web.setWebViewClient(new WebViewClientCompat() {
                      @Override public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          return loader.shouldInterceptRequest(request.getUrl());
                      }
                  });
                  setContentView(web);
                  web.loadUrl("https://appassets.androidplatform.net/assets/index.html");
              }
              @Override public void onBackPressed() { super.onBackPressed(); }
          }
          EOF
      - name: Build APK
        run: |
          cd android-app
          gradle wrapper --gradle-version 8.9
          ./gradlew assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p apk-check
          unzip -q app/build/outputs/apk/debug/app-debug.apk -d apk-check
          test -s apk-check/assets/index.html
          test $(find apk-check/assets/assets -maxdepth 1 -name 'engine-*.js' -size +500k | wc -l) -eq 1
          test $(find apk-check/assets/assets -maxdepth 1 -name 'index-*.js' -size +150k | wc -l) -eq 1
          echo "PASS: APK contains the full game engine and application bundles"
      - uses: actions/upload-artifact@v4
        with:
          name: Tuktuk-Dar-ElSalam-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: Tuktuk-Dar-ElSalam-Updated-Project
          path: Tuktuk-Dar-ElSalam-Updated-Project.zip
          if-no-files-found: error
          retention-days: 14
